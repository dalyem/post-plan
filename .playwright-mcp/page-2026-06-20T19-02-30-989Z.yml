            - heading "Why MCP is different from command suggestions" [level=2] [ref=e118]
            - generic [ref=e119]:
              - paragraph [ref=e120]: Many agents can suggest a deploy command, but that still leaves the human to switch context and run it. MCP changes that by turning deployment into an actual tool invocation.
              - paragraph [ref=e121]: For teams exploring agentic development, that difference matters. It shortens the loop from “build this UI” to “share a live preview.”
          - generic [ref=e122]:
            - heading "Where MCP fits in a delivery workflow" [level=2] [ref=e123]
            - generic [ref=e124]:
              - paragraph [ref=e125]: Use MCP for the handoff between code generation and stakeholder review. After the agent writes or edits the frontend, the same conversation can produce a live URL for review.
              - paragraph [ref=e126]: That makes PreviewShip particularly useful for design QA, prototype sharing, and rapid iteration cycles where speed is more important than full Git-based hosting automation.
              - paragraph [ref=e127]: For framework projects, instruct the agent to run the build step and deploy the generated dist, build, out, or export folder. If the agent created one self-contained HTML artifact or Markdown document, it can deploy that .html/.md/.markdown file directly.
          - generic [ref=e128]:
            - heading "Operational recommendation" [level=2] [ref=e129]
            - paragraph [ref=e131]: Keep the CLI available even if MCP is your primary workflow. CLI remains useful for CI, fallback deploys, and environments where an MCP client is not available.
