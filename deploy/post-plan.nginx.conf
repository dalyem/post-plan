# post-plan — nginx reverse proxy.
#
# The app binds to 127.0.0.1 only (see scripts/install-service.sh); nginx fronts
# it on your Tailscale hostname, or a custom domain pointed at the node's tailnet
# IP. Reachable only via Tailscale + localhost, so no app-level auth is needed —
# do NOT expose this to the public internet.
#
# Install:
#   sudo cp deploy/post-plan.nginx.conf /etc/nginx/sites-available/post-plan
#   sudo ln -s ../sites-available/post-plan /etc/nginx/sites-enabled/post-plan
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Your Tailscale (MagicDNS) hostname, and/or a custom domain that resolves to
    # the node's 100.x tailnet IP. Edit these.
    server_name devbox.your-tailnet.ts.net planned.example.dev;

    # Plans are HTML docs; allow a few MB (matches the app's request body cap).
    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:3000;   # match PORT from install-service.sh
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        # post-plan builds absolute share links from these two headers when
        # PUBLIC_BASE_URL is unset — keep them so links aren't "localhost".
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;

        # Harmless now; future-proofs any streaming/websocket use.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ── HTTPS variant ────────────────────────────────────────────────────────────
# For HTTPS on your *.ts.net name, issue a cert with `tailscale cert <name>` and
# listen on 443. (For a custom domain, use your own ACME / DNS-01 cert.) When
# serving over https, also set PUBLIC_BASE_URL=https://<name> in the service so
# returned links use https.
